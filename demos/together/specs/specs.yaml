# Specs 2 catalog following the published schema (specsplugin.com/schema):
# anatomy, props (EnumProp / BooleanProp / SlotProp with $extensions),
# default + variants deltas, invalidVariantCombinations, metadata.
# Anatomy and styles are authoring truth; Decree compiles names, props,
# combos, tokens, and deprecations only.
# `deprecated` / `replacement` are Decree extensions the schema doesn't cover.
components:
  Button:
    title: Button
    anatomy:
      root: { type: frame }
      label: { type: text }
    props:
      variant:
        type: string
        enum: [primary, secondary]
        default: primary
        $extensions:
          com.figma:
            type: VARIANT
      size:
        type: string
        enum: [sm, md, lg]
        default: md
        $extensions:
          com.figma:
            type: VARIANT
      disabled:
        type: boolean
        default: false
        $extensions:
          com.figma:
            type: BOOLEAN
      label:
        type: slot
        default: "{Label}"
        minChildren: 1
        maxChildren: 1
    default:
      layout:
        - root:
            - label
      elements:
        root:
          styles:
            color: "{color.action.primary}"
            padding: "{space.control.md}"
    variants:
      - configuration:
          variant: secondary
        elements:
          root:
            styles:
              color: "{color.action.secondary}"
      - configuration:
          variant: secondary
          size: lg
        invalid: true
    invalidVariantCombinations:
      - variant: secondary
        size: lg
    metadata:
      generator: specs-cli
      config:
        include:
          invalidCombinations: true
  Ghost:
    title: Ghost
    deprecated: true
    replacement: Button
    props:
      tone:
        type: string
        enum: [quiet]
        default: quiet
    anatomy:
      root: { type: frame }
tokens:
  color:
    action:
      primary:
        $value: "#111111"
  space:
    control:
      md:
        $value: "12px"
