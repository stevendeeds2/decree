# Example: copy to .github/workflows/decree-verify.yml and adjust.
# Assumes `npx decree setup` has added @stevendeeds/decree and `npm run decree` to the app.
# Lives under .github/examples/ so GitHub Actions does not run it in this repo.
name: decree-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check against the design system (fails only on new problems)
        run: npm run decree

      # The allowlist is the design-system package you installed.
      # Upgrade that dependency to accept a new contract.
      # Apps that still keep a copied decree.contract.json can also run:
      # - run: npx decree use @your/design-system --check
