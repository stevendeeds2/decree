# Example: copy to .github/workflows/decree-verify.yml and adjust.
# Installs Decree from git (registry publish is still blocked — see docs/PUBLISH.md).
# Lives under .github/examples/ so GitHub Actions does not run it in this repo.
name: decree-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install app deps
        run: npm ci

      - name: Install Decree from git
        run: npm install -D github:stevendeeds2/decree

      - name: Decree verify (ratchet)
        run: npx decree verify . --baseline decree.baseline.json
